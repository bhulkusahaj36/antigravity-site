<!DOCTYPE html>
<html lang="gu">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[TEST] હરિપ્રબોધમ કથામૃત</title>
    <meta name="description" content="TEST PAGE — હરિપ્રબોધમ કથામૃત" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- TEST CSS: imports production styles then applies overrides -->
    <link rel="stylesheet" href="css/test-style.css" />

    <!-- PRELOAD CRITICAL ASSETS FOR FASTER PAINT -->
    <link rel="preload" href="images/kathamrut.webp" as="image" />
    <link rel="preload" href="images/right-main.webp" as="image" />
    <link rel="preload" href="images/hero-bg.jpg" as="image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Serif+Gujarati:wght@400;700&family=Playfair+Display:wght@400;600;700&display=swap"
        rel="stylesheet" />
</head>

<body class="home-page">

    <!-- ============================================================
         TEST BADGE — remove this when merging to production
         ============================================================ -->
    <div id="testBadge" style="
        position: fixed;
        bottom: 1rem;
        right: 1rem;
        z-index: 99999;
        background: rgba(239,68,68,0.15);
        border: 1px solid rgba(239,68,68,0.5);
        color: #f87171;
        font-family: monospace;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 999px;
        pointer-events: none;
        letter-spacing: 0.05em;
    ">⚗ TEST PAGE</div>

    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <!-- NAV -->
    <nav class="navbar" id="navbar">
        <div class="container nav-inner">
            <a href="test.html" class="nav-logo">
                <span class="logo-gu">હરિપ્રબોધમ કથામૃત</span>
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="test.html" class="nav-link active">Home</a></li>
                <li><a href="search.html" class="nav-link">Search</a></li>
            </ul>
        </div>
    </nav>

    <!-- HERO (TEST: split layout) -->
    <section class="hero hero-split" id="hero">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <h1 class="hero-title">
                <img src="images/right-main.webp" alt="" class="hero-top-img" />
                <img src="images/kathamrut.webp" alt="હરિપ્રબોધમ કથામૃત" class="hero-calligraphy" />
                <span class="sr-only">હરિપ્રબોધમ કથામૃત</span>
            </h1>
            <div class="hero-quote">
                <span class="quote-mark">&ldquo;</span>
                <span id="quoteText">હૈયામાં ટોપ સુરુચિ રાખનારને કથાવર્તા સમજાવવામાં જરાય તકલીફ ન પડે.</span>
                <span class="quote-mark">&rdquo;</span>
                <span class="quote-author" id="quoteAuthor">- ગુરુહરી હરિપ્રસાદ સ્વામીજી મહારાજ</span>
                <div class="quote-dots" id="quotePagination"></div>
            </div>
            <div class="hero-actions">
                <a href="#articles" class="btn btn-primary">Read More</a>
                <a href="paravani.html" class="btn btn-primary">પરાવાણી</a>
                <a href="search.html" class="btn btn-outline">Search</a>
            </div>

            <!-- 2. MAIN CONTENT (3D coverflow carousel) -->
            <div class="hero-right" style="margin-top: 2rem;">
                <div class="cflow-wrapper">
                    <div class="cflow-scene">
                        <div class="cflow-stage" id="cfCarousel">
                            <!-- Cards injected by test.js -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- LATEST ARTICLES -->
    <section class="section articles-section" id="articles">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Latest</h2>
            </div>
            <div class="cards-grid" id="articlesGrid"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </section>

    <!-- FEATURED ARTICLES -->
    <section class="section featured-section" id="featured">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Featured</h2>
                <div class="scroll-controls">
                    <button class="scroll-btn prev-btn" aria-label="Previous">‹</button>
                    <button class="scroll-btn next-btn" aria-label="Next">›</button>
                </div>
            </div>
            <div class="avatar-row-wrapper">
                <div class="cards-grid featured-grid" id="featuredGrid"></div>
            </div>
        </div>
    </section>

    <!-- CATEGORY HIGHLIGHTS -->
    <section class="section categories-highlight" id="catHighlight">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Categories</h2>
                <div class="scroll-controls">
                    <button class="scroll-btn prev-btn" aria-label="Previous">‹</button>
                    <button class="scroll-btn next-btn" aria-label="Next">›</button>
                </div>
            </div>
            <div class="avatar-row-wrapper">
                <div class="category-chips" id="categoryChips"></div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <span class="logo-gu">હરિપ્રબોધમ કથામૃત</span>
                <p>© 2026 હરિપ્રબોધમ કથામૃત</p>
            </div>
            <div class="footer-links">
                <a href="test.html">Home</a>
                <a href="search.html">Search</a>
            </div>
        </div>
    </footer>

    <!-- ============================================================
         SCRIPTS
         data.js  → shared live data (same as production)
         utils.js → shared utilities (same as production)
         test.js  → experimental logic (replaces home.js here)
         particles.js → shared canvas particles (same as production)
         ============================================================ -->
    <script src="js/data.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/test.js" defer></script>
    <script src="js/particles.js" defer></script>

</body>

</html>
