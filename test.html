<!DOCTYPE html>
<html lang="gu">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>હરિપ્રબોધમ કથામૃત</title>
    <meta name="description" content="હરિપ્રબોધમ કથામૃત" />
    <meta property="og:title" content="હરિપ્રબોધમ કથામૃત" />
    <meta property="og:description" content="ગુજરાતી ભક્તિ સાહિત્ય અને ધાર્મિક લેખ" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="css/test.css?v=1.3.0" />

    <!-- PRELOAD CRITICAL ASSETS FOR FASTER PAINT -->
    <link rel="preload" href="images/kathamrut.webp" as="image" />
    <link rel="preload" href="images/right-main.webp" as="image" />
    <link rel="preload" href="images/hero-bg.jpg" as="image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Serif+Gujarati:wght@400;700&family=Playfair+Display:wght@400;600;700&display=swap"
        rel="stylesheet" />

    <!-- Modern Stack: Tailwind + daisyUI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#f59e0b',
                        orange: '#ea580c',
                    }
                }
            }
        }
    </script>
</head>

<body class="home-page">
    <div class="staging-banner">EXPERIMENTAL STAGING PREVIEW — NOT LIVE</div>

    <canvas id="bgCanvas" aria-hidden="true"></canvas>
    <!-- NAV -->
    <nav class="navbar" id="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="nav-logo">
                <span class="logo-gu">હરિપ્રબોધમ કથામૃત</span>
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="nav-link active">Home</a></li>
                <li><a href="search.html" class="nav-link">Search</a></li>

            </ul>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero" id="hero">
        <div class="hero-overlay"></div>
        <img src="images/kathamrut.webp" alt="હરિપ્રબોધમ કથામૃત" class="hero-calligraphy" />

        <div class="container hero-container">
            <!-- Left Wing: Branding & Identity -->
            <div class="hero-sidebar">
                <div class="hero-branding">
                    <img src="images/right-main.webp" alt="" class="hero-main-img" />
                </div>

                <div class="hero-actions">
                    <a href="#featured" class="btn btn-primary">
                        <span class="btn-icon">←</span>
                        <span class="btn-text">Read More</span>
                        <span class="btn-icon">→</span>
                    </a>
                    <a href="search.html" class="btn btn-outline">Search</a>
                </div>
            </div>

            <!-- Right Wing: Exploration (Modern 3D Carousel) -->
            <div class="hero-stage flex flex-col justify-center items-center relative">
                
                <!-- 3D ROTATING ARTICLE CARDS CAROUSEL -->
                <div class="carousel-wrapper-modern w-full max-w-5xl px-4 perspective-[2000px] z-20">
                    <div id="articleCarouselModern" class="flex gap-10 lg:gap-12 snap-x snap-mandatory overflow-x-auto py-12 scrollbar-hide cursor-grab active:cursor-grabbing">
                        <!-- 4x Primary 3D cards + Extended Articles Injected by JS -->
                    </div>
                </div>

                <!-- PRESERVED QUOTE BOX -->
                <div class="hero-quote">
                    <div class="quote-main">
                        <span class="quote-mark open">&ldquo;</span>
                        <span id="quoteText">કથાવર્તા જ જીવન છે.</span>
                        <span class="quote-mark close">&rdquo;</span>
                    </div>
                    <div id="quoteAuthor" class="quote-author">- ગુરુહરી હરિપ્રસાદ સ્વામીજી મહારાજ</div>
                    <div class="quote-pagination" id="quotePagination"></div>
                </div>
            </div>
        </div>
    </section>


    <!-- FEATURED ARTICLES -->
    <section class="section featured-section" id="featured">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Featured</h2>
                <div class="scroll-controls">
                    <button class="scroll-btn prev-btn" aria-label="Previous">‹</button>
                    <button class="scroll-btn next-btn" aria-label="Next">›</button>
                </div>
            </div>
            <div class="avatar-row-wrapper">
                <div class="cards-grid featured-grid" id="featuredGrid"></div>
            </div>
        </div>
    </section>

    <!-- CATEGORY HIGHLIGHTS -->
    <section class="section categories-highlight" id="catHighlight">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Categories</h2>
                <div class="scroll-controls">
                    <button class="scroll-btn prev-btn" aria-label="Previous">‹</button>
                    <button class="scroll-btn next-btn" aria-label="Next">›</button>
                </div>
            </div>
            <div class="avatar-row-wrapper">
                <div class="category-chips" id="categoryChips"></div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <span class="logo-gu">હરિપ્રબોધમ કથામૃત</span>
                <p>© 2026 હરિપ્રબોધમ કથામૃત</p>
            </div>
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="search.html">Search</a>

            </div>
        </div>
    </footer>

    <script src="js/data.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/test.js?v=1.3.0" defer></script>
    <script src="js/particles.js" defer></script>
</body>

</html>
